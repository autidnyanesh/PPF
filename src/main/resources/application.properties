spring.application.name=ppf
server.port=${PPF_SERVER_PORT:8082}

gbm.jwt.secret=${GBM_TOKEN_SECRET:gbm-local-dev-secret-please-change-32bytes!}
gbm.cors.allowed-origins=${GBM_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}

spring.datasource.url=${PPF_DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${PPF_DB_USERNAME:ppf}
spring.datasource.password=${PPF_DB_PASSWORD:ppf}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
